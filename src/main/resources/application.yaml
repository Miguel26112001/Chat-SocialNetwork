spring:
  application:
    name: chat-backend

  # ------------------------------------------------------------------
  # Conexión a PostgreSQL (sobreescribible por variables de entorno)
  # DB_URL completo tiene prioridad; si no, se arma con DB_HOST,
  # DB_PORT y DB_NAME.
  # ------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chat_social}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}

  # ------------------------------------------------------------------
  # Flyway gestiona el esquema. Hibernate solo valida, nunca crea
  # tablas (las migraciones son la única fuente de verdad).
  # Cada bounded context es un esquema PostgreSQL aislado; los
  # esquemas se crean automáticamente en el primer arranque.
  # El histórico de Flyway queda en "public" (primero de la lista).
  # ------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    create-schemas: true
    schemas:
      - public
      - identity
      - profiles
      - social
      - content
      - engagement
      - notifications

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# --------------------------------------------------------------------
# Puerto del servidor (sobreescribible por variable de entorno)
# --------------------------------------------------------------------
server:
  port: ${SERVER_PORT:8081}

# --------------------------------------------------------------------
# JWT (access tokens). El refresh token NO vive aquí: se gestiona
# en la tabla identity.refresh_tokens.
# En producción definir JWT_SECRET como variable de entorno.
# --------------------------------------------------------------------
security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-cambiar-en-produccion-0123456789abcdef0123456789abcdef}
    access-token-ttl: 15m

# --------------------------------------------------------------------
# CORS: orígenes del frontend (coma separada en prod con la variable
# CORS_ALLOWED_ORIGINS). Debe coincidir con el dev server de Vite.
# --------------------------------------------------------------------
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --------------------------------------------------------------------
# OpenAPI / Swagger UI (springdoc). Consola en /swagger-ui.html y
# documento JSON en /v3/api-docs.
# --------------------------------------------------------------------
springdoc:
  swagger-ui:
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true
