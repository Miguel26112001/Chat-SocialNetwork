spring:
  application:
    name: chat-backend

  # ------------------------------------------------------------------
  # Conexión a PostgreSQL (sobreescribible por variables de entorno)
  # ------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chat_social}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}

  # ------------------------------------------------------------------
  # Flyway gestiona el esquema. Hibérnate solo válida, nunca crea
  # tablas (las migraciones son la única fuente de verdad).
  # ------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
